name: Build check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript library
        run: npm run build

      - name: Build native libraries
        run: |
          for target in aarch64-macos x86_64-macos aarch64-linux x86_64-linux aarch64-windows x86_64-windows; do
            ./scripts/build-zig.sh "$target" --dynamic --release
            ./scripts/build-zig.sh "$target" --static --release
          done
